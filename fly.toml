# Fly.io config — replace `app` with your own app name (`fly launch --no-deploy --copy-config`).
app = "evopulse-CHANGE-ME"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  DB_PATH = "/data/evopulse.db"
  CONTROL_DB_PATH = "/data/control.db"
  WORKSPACE_DB_DIR = "/data/workspaces"

# SQLite lives on a Fly volume. Create it once: fly volumes create evopulse_data --size 1 --region cdg
[mounts]
  source = "evopulse_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # SQLite is single-writer: keep exactly one machine, never scale horizontally.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
