<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1024" />
  <title>Pulse · EvoPulse Control OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink-950: #080a0d;
      --ink-900: #0c1016;
      --ink-800: #131922;
      --ink-700: #1b2330;
      --ink-600: #253042;
      --paper: #efe7d6;
      --sand: #c8b896;
      --mute: #8a8476;
      --need: #f0a202;
      --miss: #e85d4c;
      --ok: #3dba8b;
      --ice: #7eb6d9;
      --line: rgba(239, 231, 214, 0.12);
      --line-strong: rgba(239, 231, 214, 0.22);
      --need-line: rgba(240, 162, 2, 0.55);
      --serif: "Instrument Serif", Georgia, serif;
      --sans: "IBM Plex Sans", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --rail: 208px;
      --inspect: 380px;
      --proto: 44px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      background: var(--ink-950);
      color: var(--paper);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.45;
      color-scheme: dark;
    }

    a { color: inherit; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    button:focus-visible,
    a:focus-visible,
    [tabindex="0"]:focus-visible {
      outline: 2px solid var(--need);
      outline-offset: 2px;
    }

    .skip {
      position: absolute;
      left: 12px;
      top: -40px;
      z-index: 20;
      padding: 8px 12px;
      background: var(--paper);
      color: var(--ink-950);
    }
    .skip:focus { top: 12px; }

    .os {
      display: grid;
      grid-template-columns: var(--rail) minmax(0, 1fr) var(--inspect);
      grid-template-rows: 1fr var(--proto);
      min-height: 100vh;
      min-width: 1024px;
    }

    .rail {
      grid-column: 1;
      grid-row: 1;
      border-right: 1px solid var(--line);
      padding: 28px 22px 20px;
      display: flex;
      flex-direction: column;
      background: var(--ink-950);
    }
    .mark {
      font-family: var(--serif);
      font-size: 26px;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .mark-sub {
      margin-top: 8px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .nav {
      margin-top: 42px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav a,
    .nav span[aria-current="page"] {
      display: flex;
      align-items: center;
      min-height: 40px;
      padding: 0 10px;
      text-decoration: none;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--sand);
      border-left: 2px solid transparent;
    }
    .nav span[aria-current="page"] {
      color: var(--paper);
      border-left-color: var(--need);
    }
    .nav a:hover { color: var(--paper); }
    .nav a.is-future { color: var(--mute); }
    .rail-foot {
      margin-top: auto;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--mute);
      letter-spacing: 0.08em;
      line-height: 1.6;
    }

    .stage {
      grid-column: 2;
      grid-row: 1;
      overflow: auto;
      padding: 36px 44px 56px;
      background:
        radial-gradient(900px 420px at 8% -20%, rgba(240, 162, 2, 0.05), transparent 50%),
        var(--ink-950);
    }

    .clock {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .headline {
      margin: 18px 0 0;
      max-width: 18ch;
      font-family: var(--serif);
      font-size: 56px;
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: -0.03em;
    }
    .tally {
      margin: 28px 0 0;
      padding: 0;
      list-style: none;
    }
    .tally li {
      display: flex;
      align-items: baseline;
      gap: 14px;
      min-height: 36px;
      font-size: 20px;
      color: var(--sand);
    }
    .tally b {
      font-family: var(--mono);
      font-weight: 500;
      font-size: 22px;
      min-width: 1.4ch;
      color: var(--paper);
    }
    .tally .is-need b { color: var(--need); }
    .tally .is-watch b { color: var(--ice); }
    .tally .is-done b { color: var(--ok); }

    .board { margin-top: 48px; }
    .section { margin-top: 32px; }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .section-head h2 {
      margin: 0;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .section-head .count {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--mute);
    }

    .rows { display: flex; flex-direction: column; }
    .row {
      display: grid;
      grid-template-columns: 148px minmax(0, 1fr) auto;
      gap: 18px;
      width: 100%;
      text-align: left;
      padding: 16px 10px 16px 12px;
      border-bottom: 1px solid var(--line);
      border-left: 2px solid transparent;
      min-height: 72px;
    }
    .row:hover { background: rgba(239, 231, 214, 0.02); }
    .row[aria-selected="true"] {
      border-left-color: var(--need);
      background: rgba(240, 162, 2, 0.04);
    }
    .row-kicker {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--sand);
      padding-top: 4px;
    }
    .row-kicker.is-need { color: var(--need); }
    .row-kicker.is-approve { color: var(--need); }
    .row-kicker.is-block { color: var(--miss); }
    .row-kicker.is-watch { color: var(--ice); }
    .row-kicker.is-done { color: var(--ok); }
    .row-title {
      margin: 0;
      font-family: var(--serif);
      font-size: 24px;
      line-height: 1.15;
    }
    .row-meta {
      margin: 6px 0 0;
      color: var(--sand);
      font-size: 13px;
    }
    .row-money {
      font-family: var(--mono);
      font-size: 18px;
      text-align: right;
      white-space: nowrap;
      padding-top: 4px;
      color: var(--paper);
      font-variant-numeric: tabular-nums;
    }
    .row-money span {
      display: block;
      margin-top: 6px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .empty {
      padding: 18px 12px;
      color: var(--mute);
      font-size: 14px;
    }
    .banner {
      margin-top: 36px;
      padding: 18px 0;
      border-top: 1px solid var(--line);
      color: var(--sand);
      max-width: 46ch;
    }
    .banner.is-error { color: var(--miss); }
    .banner.is-load { color: var(--ice); }

    .inspect {
      grid-column: 3;
      grid-row: 1;
      border-left: 1px solid var(--line);
      padding: 28px 26px 32px;
      overflow: auto;
      background: var(--ink-900);
    }
    .inspect-kicker {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .inspect h2 {
      margin: 14px 0 0;
      font-family: var(--serif);
      font-size: 32px;
      line-height: 1.1;
    }
    .inspect-status {
      margin-top: 12px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--need);
    }
    .inspect-status.is-watch { color: var(--ice); }
    .inspect-status.is-done { color: var(--ok); }
    .inspect-status.is-block { color: var(--miss); }
    .facts {
      margin: 24px 0 0;
      padding: 0;
      border-top: 1px solid var(--line);
    }
    .facts .fact {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
    }
    .facts dt {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mute);
    }
    .facts dd { margin: 0; color: var(--paper); }
    .quote {
      margin: 18px 0 0;
      padding: 0;
      font-family: var(--serif);
      font-size: 22px;
      line-height: 1.25;
      color: var(--paper);
    }
    .actions {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .more { display: none; }
    .more.is-on { display: block; }
    .more-btn {
      margin-top: 16px;
      min-height: 40px;
      color: var(--sand);
      text-align: left;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .btn {
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--need-line);
      color: var(--ink-950);
      background: var(--need);
      text-align: left;
      font-weight: 500;
    }
    .btn-ghost {
      min-height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--line-strong);
      color: var(--paper);
      text-align: left;
    }
    .btn-ghost:hover { border-color: var(--paper); }
    .ask {
      margin-top: 8px;
      min-height: 40px;
      text-align: left;
      color: var(--sand);
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .ask-out {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      color: var(--sand);
      font-size: 13px;
    }
    .ask-out.is-on { display: block; }
    .close-inspect {
      display: none;
      min-height: 36px;
      color: var(--sand);
    }

    .proto {
      grid-column: 1 / -1;
      grid-row: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-top: 1px solid var(--line);
      background: var(--ink-900);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mute);
      overflow: auto;
    }
    .proto strong { color: var(--sand); font-weight: 500; }
    .proto button {
      min-height: 28px;
      padding: 0 8px;
      color: var(--sand);
      border: 1px solid transparent;
    }
    .proto button[aria-pressed="true"] {
      color: var(--paper);
      border-color: var(--line-strong);
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(8, 10, 13, 0.55);
      z-index: 8;
    }

    @media (max-width: 1360px) {
      :root { --rail: 180px; --inspect: 320px; }
      .stage { padding: 32px 32px 48px; }
      .headline { font-size: 48px; }
      .row { grid-template-columns: 132px minmax(0, 1fr) auto; }
    }

    @media (max-width: 1100px) {
      :root { --rail: 160px; --inspect: 360px; }
      .os {
        grid-template-columns: var(--rail) minmax(0, 1fr);
      }
      .inspect {
        position: fixed;
        top: 0;
        right: 0;
        bottom: var(--proto);
        width: min(400px, 46vw);
        z-index: 9;
        transform: translateX(104%);
        transition: transform 160ms ease;
      }
      .os.is-inspect .inspect { transform: none; }
      .os.is-inspect .overlay { display: block; }
      .close-inspect { display: inline-flex; align-items: center; }
    }
  </style>
</head>

      },
      blocked: {
        clock: "Sun 27 Sep 2026 · 11:05 Africa/Tunis",
        headline: "Your business is running.",
        items: ["discount", "handled"],
        select: "discount"
      },
      empty: {
        clock: "Sun 27 Sep 2026 · 08:18 Africa/Tunis",
        headline: "Your business is running.",
        items: [],
        select: null
      },
      loading: {
        clock: "Reading clock…",
        headline: "Your business is running.",
        items: [],
        select: null,
        banner: { text: "Listening for expected versus actual. Attention is not guessed.", cls: "is-load" }
      },
      error: {
        clock: "Clock unread",
        headline: "Your business is running.",
        items: [],
        select: null,
        banner: { text: "Pulse could not read attention. No engine was changed. Try again from this screen.", cls: "is-error" }
      }
    };

    const os = document.getElementById("os");
    const tallyEl = document.getElementById("tally");
    const boardEl = document.getElementById("board");
    const inspectEl = document.getElementById("inspect");
    const clockEl = document.getElementById("clock");
    const headlineEl = document.getElementById("headline");
    const bannerEl = document.getElementById("banner");
    const overlay = document.getElementById("overlay");

    let view = "delayed";
    let selectedId = "delay";
    let askOn = false;

    function tone(attention) {
      if (attention === "MONITORING") return "is-watch";
      if (attention === "HANDLED") return "is-done";
      if (attention === "BLOCKED") return "is-block";
      if (attention === "NEEDS_APPROVAL") return "is-approve";
      return "is-need";
    }

    function itemsFor(state) {
      return STATES[state].items.map((key) => ({ key, ...DATA[key] }));
    }

    function counts(items) {
      return {
        needs: items.filter((i) => i.section === "needs").length,
        watch: items.filter((i) => i.section === "watch").length,
        done: items.filter((i) => i.section === "done").length
      };
    }

    function renderTally(c) {
      tallyEl.innerHTML =
        `<li class="is-need"><b>${c.needs}</b> need you</li>` +
        `<li class="is-watch"><b>${c.watch}</b> monitoring</li>` +
        `<li class="is-done"><b>${c.done}</b> handled automatically</li>`;
    }

    function rowHtml(item) {
      const selected = item.key === selectedId;
      return `
        <button class="row${selected ? "" : ""}" type="button" role="option" aria-selected="${selected}" data-key="${item.key}">
          <div class="row-kicker ${tone(item.attention)}">${item.label}${item.secondary ? `<br />${item.secondary}` : ""}</div>
          <div>
            <h3 class="row-title">${item.title}</h3>
            <p class="row-meta">${item.summary}</p>
          </div>
          <div class="row-money">${money(item.amount)}<span>${item.amountNote}</span></div>
        </button>`;
    }

    function sectionHtml(title, items, empty) {
      return `
        <section class="section" aria-labelledby="${title}">
          <div class="section-head">
            <h2 id="${title}">${title.replace("-", " ")}</h2>
            <span class="count">${items.length}</span>
          </div>
          ${items.length ? `<div class="rows" role="listbox" aria-label="${title}">${items.map(rowHtml).join("")}</div>` : `<p class="empty">${empty}</p>`}
        </section>`;
    }

    function renderBoard(items) {
      const needs = items.filter((i) => i.section === "needs");
      const watch = items.filter((i) => i.section === "watch");
      const done = items.filter((i) => i.section === "done");
      boardEl.innerHTML =
        sectionHtml("needs-you", needs, "Nothing needs you. Pulse is quiet.") +
        sectionHtml("monitoring", watch, "Nothing is being watched. Verification starts after a human-approved action.") +
        sectionHtml("handled", done, "Nothing handled automatically yet. Execution still waits on verification.");
    }

    function renderInspect(item) {
      if (!item) {
        inspectEl.innerHTML = `
          <div class="inspect-kicker">
            <span>Inspect</span>
            <button class="close-inspect" type="button" data-close>Close</button>
          </div>
          <h2>No situation selected</h2>
          <p class="row-meta" style="margin-top:12px">Pulse lists attention objects. Select a row to see evidence, expected versus actual, and the next safe action.</p>`;
        return;
      }
      inspectEl.innerHTML = `
        <div class="inspect-kicker">
          <span>Inspect · ${item.kind.replaceAll("_", " ")}</span>
          <button class="close-inspect" type="button" data-close>Close</button>
        </div>
        <h2>${item.title}</h2>
        <p class="inspect-status ${tone(item.attention)}">${item.label}${item.secondary ? " · " + item.secondary : ""}</p>
        <blockquote class="quote">“${item.quote}”</blockquote>
        <div class="actions">
          <button class="btn" type="button" data-primary>${item.primary.label}</button>
          <button class="btn-ghost" type="button" data-secondary>${item.secondaryAction.label}</button>
          <button class="ask" type="button" data-ask>Ask EvoPulse about this…</button>
          <div class="ask-out${askOn ? " is-on" : ""}" id="ask-out">${item.ask}</div>
        </div>
        <dl class="facts">
          <div class="fact"><dt>Source</dt><dd>${item.source}</dd></div>
          <div class="fact"><dt>Expected</dt><dd>${item.expected}</dd></div>
          <div class="fact"><dt>Actual</dt><dd>${item.actual}</dd></div>
          <div class="fact"><dt>Timestamp</dt><dd>${item.evidenceAt}</dd></div>
          <div class="fact"><dt>Confidence</dt><dd>${item.confidence}</dd></div>
          <div class="fact"><dt>Value</dt><dd>${money(item.amount)} · ${item.amountNote}</dd></div>
        </dl>
        <button class="more-btn" type="button" data-more aria-expanded="false">Show chain and objects</button>
        <div class="more" id="more">
          <dl class="facts">
            <div class="fact"><dt>Detected</dt><dd>${item.detected}</dd></div>
            <div class="fact"><dt>Stored</dt><dd>${item.storedAttention.replaceAll("_", " ")}</dd></div>
            <div class="fact"><dt>Expectation</dt><dd>${item.expectation}</dd></div>
            <div class="fact"><dt>Chain</dt><dd>${item.chain}</dd></div>
            ${item.facts.map((f) => `<div class="fact"><dt>${f[0]}</dt><dd>${f[1]}</dd></div>`).join("")}
            <div class="fact"><dt>Affected</dt><dd>${item.objects.join(" · ")}</dd></div>
          </dl>
        </div>`;
    }

    function applyState(name, select) {
      view = name;
      const state = STATES[name];
      const items = itemsFor(name);
      selectedId = select !== undefined ? select : (state.select || (items[0] && items[0].key) || null);
      askOn = false;
      clockEl.textContent = state.clock;
      headlineEl.textContent = state.headline;
      if (state.banner) {
        bannerEl.hidden = false;
        bannerEl.className = "banner " + state.banner.cls;
        bannerEl.textContent = state.banner.text;
      } else {
        bannerEl.hidden = true;
        bannerEl.textContent = "";
      }
      renderTally(counts(items));
      renderBoard(items);
      renderInspect(items.find((i) => i.key === selectedId) || null);
      document.querySelectorAll(".proto button[data-state]").forEach((b) => {
        b.setAttribute("aria-pressed", b.dataset.state === name ? "true" : "false");
      });
      const narrow = window.matchMedia("(max-width: 1100px)").matches;
      os.classList.toggle("is-inspect", Boolean(selectedId) && narrow);
      overlay.hidden = !(selectedId && narrow);
    }

    function selectRow(key) {
      selectedId = key;
      askOn = false;
      const items = itemsFor(view);
      renderBoard(items);
      renderInspect(items.find((i) => i.key === key) || null);
      const narrow = window.matchMedia("(max-width: 1100px)").matches;
      os.classList.toggle("is-inspect", Boolean(key) && narrow);
      overlay.hidden = !(key && narrow);
    }

    function closeInspect() {
      os.classList.remove("is-inspect");
      overlay.hidden = true;
    }

    boardEl.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-key]");
      if (btn) selectRow(btn.dataset.key);
    });

    inspectEl.addEventListener("click", (e) => {
      if (e.target.closest("[data-close]")) closeInspect();
      if (e.target.closest("[data-ask]")) {
        askOn = !askOn;
        const out = document.getElementById("ask-out");
        if (out) out.classList.toggle("is-on", askOn);
      }
      if (e.target.closest("[data-more]")) {
        const more = document.getElementById("more");
        const btn = e.target.closest("[data-more]");
        const on = !more.classList.contains("is-on");
        more.classList.toggle("is-on", on);
        btn.setAttribute("aria-expanded", on ? "true" : "false");
        btn.textContent = on ? "Hide chain and objects" : "Show chain and objects";
      }
      if (e.target.closest("[data-primary]")) {
        const item = itemsFor(view).find((i) => i.key === selectedId);
        if (item && item.id === "exc_discount_blocked") {
          /* stay on this object — alternatives are already in inspector */
          return;
        }
        if (item && item.primary.href === "#blocked") {
          applyState("blocked");
        }
      }
    });

    overlay.addEventListener("click", closeInspect);

    document.querySelector(".proto").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-state]");
      if (btn) applyState(btn.dataset.state);
    });

    document.querySelector(".nav").addEventListener("click", (e) => {
      const link = e.target.closest("[data-future]");
      if (!link) return;
      e.preventDefault();
      const name = link.dataset.future;
      bannerEl.hidden = false;
      bannerEl.className = "banner";
      bannerEl.textContent = name.toUpperCase() + " is another Control OS screen. Pulse does not invent engines here.";
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeInspect();
      if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      const items = itemsFor(view);
      if (!items.length) return;
      const idx = Math.max(0, items.findIndex((i) => i.key === selectedId));
      const next = e.key === "ArrowDown" ? Math.min(items.length - 1, idx + 1) : Math.max(0, idx - 1);
      selectRow(items[next].key);
      e.preventDefault();
    });

    window.addEventListener("resize", () => {
      const narrow = window.matchMedia("(max-width: 1100px)").matches;
      os.classList.toggle("is-inspect", Boolean(selectedId) && narrow);
      overlay.hidden = !(selectedId && narrow);
    });

    applyState("delayed");
  </script>
</body>
</html>
